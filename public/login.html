
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | EL CRITERIO</title>

    <meta name="description" content="Acceso al sistema editorial de EL CRITERIO.">

    <link rel="stylesheet" href="/css/styles.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101827;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .login-header {
            padding: 24px 7%;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .brand {
            color: #ffffff;
            text-decoration: none;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand span {
            color: #d62828;
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            color: #172033;
            padding: 42px;
            border-radius: 8px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .login-label {
            color: #d62828;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .login-card h1 {
            margin: 12px 0 8px;
            font-size: 30px;
        }

        .login-description {
            color: #697386;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8dde5;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus {
            border-color: #d62828;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #d62828;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #d62828;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #b51e25;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .login-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #697386;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #d62828;
        }

        .login-footer {
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            .login-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header class="login-header">
        <a href="/" class="brand">
            EL <span>CRITERIO</span>
        </a>
    </header>

    <main class="login-container">

        <section class="login-card">

            <span class="login-label">Sistema editorial</span>

            <h1>Bienvenido</h1>

            <p class="login-description">
                Ingresa con tu cuenta para acceder al panel de gestión
                de EL CRITERIO.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Correo electrónico</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nombre@correo.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Iniciar sesión
                </button>

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>

            <a href="/" class="back-link">
                ← Volver a la página principal
            </a>

        </section>

    </main>

    <footer class="login-footer">
        © <span id="currentYear"></span> EL CRITERIO.
        Todos los derechos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>

</body>
</html>
